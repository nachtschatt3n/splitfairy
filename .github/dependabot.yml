version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node 24 runtime (see the docker entry below).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 24 LTS line (matches engines and CI); move to the next major once it is LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]
