name: CI and image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: splitfairy-${{ github.ref }}
  # Never cancel main: every main commit needs its sha- image so it can be released later.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/nachtschatt3n/splitfairy
jobs:
  verify:
    # Tags do not re-test: a release promotes a main commit whose verify already passed (checked in the release job).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      - run: npm run check
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-firefox-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit firefox
      - name: Install browser system libraries
        run: npx playwright install-deps chromium webkit firefox
      # Mocked UI tests plus real-server flow and UX tests on iPhone (WebKit, Chromium) and desktop.
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  image:
    # Runs next to verify instead of after it: pull requests build and smoke-test the container, main pushes publish
    # sha-<commit> candidates. A candidate is only released if verify passed for the same commit (see release).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}
      - name: Smoke-test the container
        if: github.event_name != 'push'
        run: |
          docker run -d --name splitfairy -p 3000:3000 \
            -e ADMIN_EMAIL=ci@example.invalid -e AUTH_SECRET="$(openssl rand -hex 32)" \
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:3000/readyz && break; sleep 1; done
          curl -sf localhost:3000/readyz
          curl -sf localhost:3000/ | grep -q '<title>Splitfairy'
          docker exec splitfairy node dist/server/scripts/backup.js
          docker stop -t 10 splitfairy
          test "$(docker inspect -f '{{.State.ExitCode}}' splitfairy)" = 0
  release:
    # A v* tag promotes the image main built for that exact commit, after confirming main's verify passed for it.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - name: Require a tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=verify" \
              --jq '[.check_runs[] | select(.status=="completed")] | if length==0 then "pending" elif any(.conclusion=="success") then "success" else "failure" end')
            echo "verify for ${GITHUB_SHA}: $state"
            [ "$state" = success ] && exit 0
            [ "$state" = failure ] && { echo "::error::verify failed for this commit; not releasing"; exit 1; }
            sleep 30
          done
          echo "::error::no verify result for this commit (tag a commit that is on main)"; exit 1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the main image
        run: |
          for i in $(seq 1 40); do
            docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" >/dev/null 2>&1 && exit 0
            echo "Waiting for ${IMAGE}:sha-${GITHUB_SHA}"; sleep 30
          done
          exit 1
      - name: Promote tested image without rebuilding
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
          echo "Released ${IMAGE}:${GITHUB_REF_NAME} from tested sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
